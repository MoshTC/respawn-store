<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo de Consolas y Hardware — Respawn Store</title>
  <meta name="description" content="Explora el catálogo completo de consolas PlayStation 5, Xbox Series X|S, Nintendo Switch OLED, Steam Deck y accesorios gaming en Respawn Store.">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Tabler Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3/dist/tabler-icons.min.css">
  
  <!-- Estilos -->
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/cart.css">
</head>
<body>

  <!-- Inyección de Navbar Común -->
  <div id="navbar"></div>

  <main style="max-width: 1300px; margin: 0 auto; padding: 2rem 1.5rem;">
    <!-- Breadcrumb -->
    <div class="breadcrumb" aria-label="Ruta de navegación" style="margin-bottom: 1.5rem; font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px;">
      <a href="../index.html" style="color: var(--muted); text-decoration: none;"><i class="ti ti-home"></i> Inicio</a>
      <span>/</span>
      <span style="color: #00e5ff; font-weight: 600;">Productos</span>
    </div>

    <!-- Header de la Página -->
    <div style="margin-bottom: 2rem;">
      <h1 class="section-title" style="font-size: 38px;">Catálogo Oficial de Consolas & Hardware</h1>
      <p class="section-sub">Hardware garantizado con entrega express a todo el territorio nacional.</p>
    </div>

    <!-- Barra de Búsqueda y Filtros en la Página -->
    <div style="background: var(--bg3); border: 1px solid var(--border); border-radius: 10px; padding: 1.25rem; margin-bottom: 2rem;">
      <div style="display: flex; gap: 1rem; flex-wrap: wrap; align-items: center; justify-content: space-between;">
        
        <!-- Píldoras de Categoría -->
        <div class="pills" role="tablist">
          <button class="pill active" data-cat="all">Todas las Consolas</button>
          <button class="pill" data-cat="playstation">PlayStation</button>
          <button class="pill" data-cat="xbox">Xbox</button>
          <button class="pill" data-cat="nintendo">Nintendo</button>
          <button class="pill" data-cat="portatil">Portátiles</button>
        </div>

        <!-- Buscador en tiempo real de catálogo -->
        <div style="display: flex; gap: 10px; align-items: center; flex: 1; max-width: 320px;">
          <div class="search-box" style="width: 100%;">
            <i class="ti ti-search search-icon"></i>
            <input type="text" id="catalog-search-filter" placeholder="Filtrar por nombre o marca..." aria-label="Filtrar catálogo">
          </div>
        </div>

        <!-- Ordenación -->
        <div>
          <select class="sort-select" aria-label="Ordenar productos">
            <option value="popular">Más populares</option>
            <option value="price-asc">Precio: menor a mayor</option>
            <option value="price-desc">Precio: mayor a menor</option>
            <option value="name-asc">Nombre (A - Z)</option>
          </select>
        </div>

      </div>
    </div>

    <!-- Grid de Productos -->
    <div id="catalog-products-grid" class="products" style="margin-bottom: 3rem;"></div>
  </main>

  <!-- Inyección de Footer Común -->
  <div id="site-footer"></div>

  <!-- Scripts -->
  <script src="../js/data/products.js"></script>
  <script src="../js/data/games.js"></script>
  <script src="../js/modules/toast.js"></script>
  <script src="../js/modules/cart.js"></script>
  <script src="../js/modules/wishlist.js"></script>
  <script src="../js/modules/quickview.js"></script>
  <script src="../js/modules/search.js"></script>
  <script src="../js/modules/catalog.js"></script>
  <script src="../js/main.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      Catalog.init('catalog-products-grid');
    });
  </script>

</body>
</html>
